name: GitHub Workflow for ROR Backend + Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Set up Node
        uses: actions/setup-node@v2
        with:
          node-version: lts/*

      - name: Build Frontend (frontend_main)
        run: |
          cd frontend_main
          npm install
          npm run build

      - name: Build Frontend (frontend_landlord)
        run: |
          cd frontend_landlord
          npm install
          npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.SSH_PRIV_KEY_VM }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa
          ssh-keyscan -H 80.225.208.243 >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Copy Backend Code to Server
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" ./backend/ \
            ubuntu@80.225.208.243:/home/ubuntu/ROR/backend

      - name: Copy Frontend_main Build to Server
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" \
            ./frontend_main/dist/ \
            ubuntu@80.225.208.243:/home/ubuntu/ROR/frontend_main

      - name: Copy Frontend_landlord Build to Server
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" \
            ./frontend_landlord/dist/ \
            ubuntu@80.225.208.243:/home/ubuntu/ROR/frontend_landlord

      - name: Restart Backend Services
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@80.225.208.243 << 'EOF'
            cd /home/ubuntu/ROR/backend
            docker compose down
            docker compose up --build -d
          EOF
